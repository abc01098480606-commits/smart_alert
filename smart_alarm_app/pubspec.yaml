name: smart_alarm_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '^3.13.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  web_socket_channel: ^3.0.3
  google_fonts: ^8.2.1
  flutter_map: ^7.0.0
  latlong2: ^0.9.1
  audioplayers: ^6.8.1
  flutter_secure_storage: ^9.0.0
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1

flutter_icons:
  image_path: "assets/app_icon.png"
  android: true
  ios: true
  image_path_android: "assets/app_icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/alarm.mp3
    - assets/app_icon.png
    - assets/fire1.jpg
    - assets/fire2.jpg
    - assets/fire3.jpg
    - assets/fire4.jpg